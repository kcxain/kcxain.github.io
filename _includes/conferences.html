<section id="conferences" class="content-section" aria-labelledby="conferences-title">
  <h2 id="conferences-title">Activities</h2>
  <img class="conference-map" src="{{ '/images/conferences.svg' | relative_url }}" width="900" height="441" alt="World map marking {% for conference in site.data.conferences %}{{ conference.city | escape }}{% unless forloop.last %}, {% endunless %}{% endfor %}. Conference details follow below." loading="lazy" decoding="async">
  <ul class="detail-list conference-list">
    {% for conference in site.data.conferences %}
    <li>
      <span class="date">[<time datetime="{{ conference.date_start | date: '%Y-%m' }}">{{ conference.date_start | date: '%Y.%m' }}</time>]</span>
      <a href="{{ conference.source_url | escape }}">{{ conference.name | escape }}</a>{% if conference.name_zh %}<span lang="zh">（{{ conference.name_zh | escape }}）</span>{% endif %}, {{ conference.city | escape }}
    </li>
    {% endfor %}
  </ul>
</section>
