{% if jekyll.environment == "production" and site.google_analytics_id and page.analytics != false %}
<script>
  // Keep analytics off the initial rendering path and out of local previews.
  window.addEventListener("load", function () {
    function loadAnalytics() {
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", {{ site.google_analytics_id | jsonify }});
      var script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent({{ site.google_analytics_id | jsonify }});
      document.head.appendChild(script);
    }
    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(loadAnalytics, { timeout: 2000 });
    } else {
      window.setTimeout(loadAnalytics, 0);
    }
  }, { once: true });
</script>
{% endif %}
