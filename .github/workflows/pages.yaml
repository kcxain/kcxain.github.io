name: Build and Deploy Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify profile stats failure recovery
        run: python3 -m unittest discover -s scripts -p 'test_profile_stats.py'

      - name: Restore last successful profile counts
        uses: actions/cache/restore@v4
        with:
          path: _data/profile_stats.json
          key: profile-stats-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: profile-stats-v1-

      - name: Refresh public profile counts
        run: python3 scripts/update_profile_stats.py

      - name: Generate conference map
        run: python3 scripts/generate_conference_map.py

      - name: Cache profile counts
        uses: actions/cache/save@v4
        with:
          path: _data/profile_stats.json
          key: profile-stats-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify generated site and asset budgets
        run: python3 scripts/check_site.py _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
